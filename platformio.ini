; digix0x dual-target build. Same sources for every env; board-specific
; pins/defaults are auto-selected in config.h. Build one env, e.g.:
;   pio run -e esp32-c6        (build)
;   pio run -e esp32-c6 -t upload   (flash)
[platformio]
src_dir = .
default_envs = esp32-c6

[env]
framework = arduino
build_src_filter = +<*.ino> +<*.cpp> +<*.c> -<host/>
monitor_speed = 115200

[env:esp32-c6]
platform = espressif32
board = esp32-c6-devkitc-1

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32]
platform = espressif32
board = esp32dev

; SAMD51 (Metro M4). Requires the three libs below; I2S only when
; CONFIG_AUDIO_OUT uses it - see config.h.
[env:metro_m4]
platform = atmelsam
board = adafruit_metro_m4
lib_deps =
	SAMD51 Interrupt Timer
	arduino-libraries/MIDIUSB
	adafruit/Adafruit Zero I2S Library
